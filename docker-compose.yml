services:
  jobsearch-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobsearch-mcp
    ports:
      # Loopback-only: the MCP server has no built-in auth. Reached from other
      # containers over forge-net by name, and from the host via 127.0.0.1.
      - "127.0.0.1:8383:8383"
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@jobsearch-postgres:5432/jobsearch
      - QDRANT_URL=http://jobsearch-qdrant:6333
      - VALKEY_URL=redis://jobsearch-valkey:6379
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}
      # Service URLs resolve by container name over forge-net.
      - FIRECRAWL_URL=${FIRECRAWL_URL:-http://firecrawl-api:3002}
      - CRAWL4AI_URL=${CRAWL4AI_URL:-http://crawl4ai:11235}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - USAJOBS_API_KEY=${USAJOBS_API_KEY:-}
      - USAJOBS_EMAIL=${USAJOBS_EMAIL:-}
      - FINDWORK_API_KEY=${FINDWORK_API_KEY:-}
      - MCP_PORT=8383
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      jobsearch-postgres:
        condition: service_healthy
      jobsearch-qdrant:
        condition: service_started
      jobsearch-valkey:
        condition: service_started
    networks:
      # forge-net for outbound reach to firecrawl-api / crawl4ai / ollama and
      # inbound from librechat; jobsearch-net for the private datastores.
      - forge-net
      - jobsearch-net
    restart: unless-stopped

  job-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-watcher
    command: >
      sh -c "while true; do python -m jobsearch_mcp.job_watcher; sleep ${JOB_WATCH_INTERVAL_SECONDS:-14400}; done"
    env_file: job-watcher.env
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      jobsearch-postgres:
        condition: service_healthy
      jobsearch-valkey:
        condition: service_started
    networks:
      # jobsearch-net only. The watcher talks to Postgres and to external job
      # APIs / SMTP over the default gateway — it does not use Firecrawl,
      # Crawl4AI, Ollama or Qdrant, so it has no reason to be on forge-net.
      - jobsearch-net
    restart: unless-stopped

  jobsearch-postgres:
    image: postgres:16
    container_name: jobsearch-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=jobsearch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - jobsearch-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jobsearch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jobsearch-qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: jobsearch-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    security_opt:
      - no-new-privileges:true
    networks:
      - jobsearch-net
    restart: unless-stopped

  jobsearch-valkey:
    image: valkey/valkey:7-alpine
    container_name: jobsearch-valkey
    security_opt:
      - no-new-privileges:true
    networks:
      - jobsearch-net
    restart: unless-stopped

networks:
  # forge-net is created outside this stack — firecrawl-api, crawl4ai, ollama
  # and librechat are already attached to it.
  forge-net:
    external: true
    name: forge-net
  jobsearch-net:
    name: jobsearch-net

volumes:
  postgres-data:
  qdrant-data:
